plugins {
    id 'java'
    id 'maven-publish'
}

group = "ru.mrbedrockpy"
version = "1.0"
def artifact = "BedPackets"

repositories {
    mavenCentral()
}

dependencies {
    implementation "io.netty:netty-buffer:4.2.12.Final"
    implementation "io.netty:netty-handler:4.2.12.Final"
    implementation "io.netty:netty-transport:4.2.12.Final"
    implementation project(":core")
}

shadowJar {
    configurations = project.configurations.named('runtimeClasspath').map { [it] }
    archiveFileName = "${project.parent.name}-${project.version}.jar"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = group
            artifactId = artifact
            version = version
        }
    }
    repositories {
        maven {
            name = "Nexus"
            def baseUrl = "https://repo.mrbedrockpy.ru/repository"
            url = version.endsWith('SNAPSHOT') ? "$baseUrl/maven-snapshots/" : "$baseUrl/maven-releases/"
            credentials {
                username = project.findProperty("nexusUsername") ?: System.getenv("NEXUS_USERNAME")
                password = project.findProperty("nexusPassword") ?: System.getenv("NEXUS_PASSWORD")
            }
        }
    }
}